name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No key in CI: the AI layer is tested with a fake transport and never calls a model.
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy .
      - name: Tests
        run: pytest
      - name: Evaluation (heuristics only)
        run: python -m backlink_lens evaluate
      - name: Sample data is in sync with its generator
        run: |
          python scripts/make_samples.py
          git diff --exit-code --stat -- sample_data/*.csv sample_data/*.tsv
